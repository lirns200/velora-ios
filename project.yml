name: Velora
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    APP_BUNDLE_ID: app.velora.client
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  VPNCore:
    path: Packages/VPNCore
targets:
  Velora:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, Velora.entitlements, Resources/ThirdPartyLicenses]
      - path: App/Resources/ThirdPartyLicenses
        type: folder
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Velora.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: VPNCore
      - target: PacketTunnel
        embed: true
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
        excludes: [Info.plist, PacketTunnel.entitlements]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).PacketTunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: VPNCore
      - framework: Vendor/LibXray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
      - sdk: libz.tbd
schemes:
  Velora:
    build:
      targets:
        Velora: all
    run:
      config: Debug
    archive:
      config: Release
